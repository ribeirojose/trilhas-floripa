<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilhas de Florianópolis</title>
  <meta name="description" content="Mapa colaborativo e aberto das trilhas de Florianópolis e região, alimentado por OpenStreetMap." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 19h4l4-6 3 4 3-5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="6" r="2" fill="currentColor"/>
      </svg>
      <div>
        <h1>Trilhas de Florianópolis</h1>
        <p class="tagline">Mapa aberto e colaborativo · dados do OpenStreetMap</p>
      </div>
    </div>
    <div class="actions">
      <span id="trail-count" class="count">…</span>
      <a class="btn btn-primary" href="https://www.openstreetmap.org/edit" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Adicionar trilha
      </a>
      <a class="btn btn-ghost" href="https://github.com/ribeirojose/trilhas-floripa" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Buscar trilha…" autocomplete="off" aria-label="Buscar trilha" />
        </div>
        <div class="regions" role="tablist" aria-label="Regiões">
          <button class="region-btn active" data-region="" role="tab" aria-selected="true">Todas</button>
          <button class="region-btn" data-region="norte" role="tab" aria-selected="false">Norte</button>
          <button class="region-btn" data-region="leste" role="tab" aria-selected="false">Leste</button>
          <button class="region-btn" data-region="centro-oeste" role="tab" aria-selected="false">Centro-Oeste</button>
          <button class="region-btn" data-region="sul" role="tab" aria-selected="false">Sul</button>
          <button class="region-btn" data-region="continente" role="tab" aria-selected="false">Continente</button>
        </div>
        <div class="filters">
          <select id="difficulty-filter" aria-label="Filtrar por dificuldade">
            <option value="">Toda dificuldade</option>
            <option value="easy">Fácil</option>
            <option value="medium">Moderada</option>
            <option value="difficult">Difícil</option>
          </select>
          <select id="kind-filter" aria-label="Filtrar por tipo">
            <option value="">Todo tipo</option>
            <option value="trilha">Trilha</option>
            <option value="caminho">Caminho</option>
          </select>
        </div>
      </div>

      <ul id="trail-list" class="trail-list"></ul>
      <p id="list-empty" class="empty" hidden>Nenhuma trilha encontrada.</p>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="legend" aria-label="Legenda de dificuldade">
        <span><i style="background:#16a34a"></i>Fácil</span>
        <span><i style="background:#ea580c"></i>Moderada</span>
        <span><i style="background:#dc2626"></i>Difícil</span>
        <span><i style="background:#7c3aed"></i>Sem classificação</span>
      </div>
      <div id="loading" class="loading">Carregando trilhas…</div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=3"></script>
</body>
</html>
